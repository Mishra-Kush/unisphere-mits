<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Login | UNISPHERE</title>
<meta name="description" content="UNISPHERE: clubs, events, calendar and notices for MITS-DU, Gwalior.">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="login">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">

<div class="wrap"><form class="formcard" id="login-form" novalidate>
<h1 style="font-size:1.8rem">Student Login</h1><p class="muted">Use your college email ending in @mitsgwl.ac.in.</p>
<div id="form-alert" class="alert err" role="alert" tabindex="-1" hidden></div>
<div class="field"><label for="email">College email</label><input id="email" type="email" autocomplete="username" required placeholder="name@mitsgwl.ac.in"><span class="err" id="email-err"></span></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-pink" id="submit" type="submit" style="width:100%">Log in</button>
<p style="margin:18px 0 0" class="muted">New here? <a href="student-register.html">Create a student account</a><br>Staff: <a href="admin-login.html">Administrator login</a></p></form></div>
</main>
<footer id="site-footer"></footer>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px;text-align:center">UNISPHERE needs JavaScript to load clubs and events.</p></noscript>
<script src="assets/js/app.js"></script>
<script src="assets/js/account.js"></script>
</body>
</html>
